};

/* 화면 맞추기 */
function fit(){const vv=window.visualViewport;const vw=vv?vv.width:innerWidth,vh=vv?vv.height:innerHeight;const ox=vv?vv.offsetLeft:0,oy=vv?vv.offsetTop:0;
 const port=vh>vw;document.body.classList.toggle('port',port);const W=port?720:1280,H=port?1280:720;const sc=Math.min(vw/W,vh/H);

 bubble(S.order.map(x=>`<div class="item">${icon(x.name)}${x.qty>1?`<span class="q">×${x.qty}</span>`:''}</div>`).join(''));
 await talk([['cust',`안녕하세요! ${orderText(S.order)}`]]);
 const lack=S.order.filter(x=>(S.stock[x.name]||0)<x.qty);
 if(lack.length){S.missed++;custMood('sad');ownerMood('sad');sfx.no();bubble(lack.map(x=>`<div class="item" style="opacity:.45">${icon(x.name)}</div>`).join('')+'<div class="big">?</div>');
  await talk([['cust',`어? ${lack.map(x=>x.name).join(', ')} 다 떨어졌어요? 아쉬워요.`],['guide','재료가 모자라서 못 팔았어요. 다음엔 넉넉히 사요.']]);
  hideBubble();const c2=$('cust');c2.classList.remove('walkin');anim(c2,'walkout');await wait(1000);c2.innerHTML='';S.n<S.perDay?nextCustomer():settle();return}
 askTotal()}
function choices(t){const step=S.level===1?100:(S.level===2?500:[100,500,1000][rnd(0,2)]);const set=new Set([t]);let guard=0;while(set.size<3&&guard++<50){const v=t+step*(Math.random()<.5?-1:1)*rnd(1,2);if(v>0)set.add(v)}return[...set].sort(()=>Math.random()-.5)}
function askTotal(){S.phase='total';S.choiceSet=S.choiceSet||choices(S.total);
 bubble(S.order.map(x=>`<div class="item">${icon(x.name)}${x.qty>1?`<span class="q">×${x.qty}</span>`:''}<div class="pr">${fmt(x.price)}</div></div>`).join(''));
 $('area').style.width='860px';$('area').innerHTML=S.choiceSet.map(v=>`<button class="choice" data-v="${v}">${fmt(v)}</button>`).join('');
 $('area').querySelectorAll('.choice').forEach(b=>b.onclick=()=>pickTotal(+b.dataset.v,b));
 if(!S.tries)talk([['guide','모두 얼마일까요?']])}
async function pickTotal(v,btn){if(S.busy||S.phase!=='total')return;S.busy=true;
 if(v===S.total){sfx.ok();btn.classList.add('glow');ownerMood('happy');custMood('happy');await wait(500);S.busy=false;toPay();return}
 S.tries++;sfx.no();custMood('sad');ownerMood('sad');
 if(S.tries===1){await talk([['cust','어? 그게 아닌 것 같아요.']]);}
 else if(S.tries===2){const eq=$('eq');const single=S.order.length===1&&S.order[0].qty===1;eq.style.display=single?'none':'block';eq.innerHTML=S.order.map(x=>x.qty>1?`${fmt(x.price)}×${x.qty}`:fmt(x.price)).join(' + ')+' = <b>?</b>';anim(eq,'flash');
  const one=S.order.length===1&&S.order[0].qty===1;await talk([['guide',one?`메뉴판에서 ${S.order[0].name} 값을 찾아봐요.`:'같이 더해 봐요. '+S.order.map(x=>x.qty>1?`${won(x.price)} ${x.qty}번`:won(x.price)).join(' 더하기 ')+'.']]);}
 else{const right=[...$('area').children].find(b=>+b.dataset.v===S.total);right&&right.classList.add('glow');await talk([['guide',`정답은 ${won(S.total)}이에요.`]]);await wait(600);S.busy=false;toPay();return}
 custMood('normal');S.busy=false}
async function toPay(){S.phase='pay';S.tries=0;$('eq').style.display='none';$('area').innerHTML='';
 S.paid=genPaid(S.total);S.paidSum=sum(S.paid);
 bubble(`<div class="big">${fmt(S.paidSum)}</div>`);
 $('paw').innerHTML=S.paid.map(v=>moneyEl(v)).join('');$('paw').classList.add('pulse');
 await talk([['cust',`${won(S.total)}이요? 여기 ${won(S.paidSum)} 낼게요.`],['guide','손님 돈을 눌러서 받아요.']]);
 if(S.phase!=='pay')return;
 $('paw').querySelectorAll('.money').forEach(m=>m.onclick=receive);
 pointAt($('paw'),3500)}
async function receive(){if(S.busy||S.phase!=='pay')return;S.busy=true;hideHand();const p=$('paw');p.classList.remove('pulse');const from=stageXY(p);const html=p.innerHTML;p.innerHTML='';sfx.coin();
 const rc=center($('reg'));await fly(`<div class="sm" style="display:flex">${html}</div>`,from,[rc[0]-50,rc[1]-30]);sfx.ching();sparkle(rc[0],rc[1],10);
 S.busy=false;askChange()}
function plateHTML(){const g={};S.plate.forEach(v=>g[v]=(g[v]||0)+1);return Object.keys(g).map(Number).sort((a,b)=>b-a).map(v=>`<span class="pg" data-v="${v}">${moneyEl(v)}${g[v]>1?`<b>×${g[v]}</b>`:''}</span>`).join('')}
async function askChange(){S.phase='change';const L=LV[S.level];
 bubble(`<svg width="90" height="90" viewBox="0 0 60 60"><circle cx="24" cy="34" r="16" fill="#E3E6EA" stroke="#A9AEB5" stroke-width="3"/><circle cx="36" cy="26" r="16" fill="#EDEFF2" stroke="#8F96A0" stroke-width="3"/></svg><div class="big">?</div>`);
 const eq=$('eq');eq.style.display='block';eq.innerHTML=`${fmt(S.paidSum)} − ${fmt(S.total)} = <b>?</b>`;
 $('plate').style.display='flex';$('plate').innerHTML=plateHTML();
 $('area').style.width='640px';$('area').innerHTML=L.safe.map(d=>moneyEl(d)).join('');
 $('give').style.display='flex';$('give').disabled=!S.plate.length;
 $('area').querySelectorAll('.money').forEach(m=>m.onclick=()=>addMoney(+m.dataset.v,m));
 $('give').onclick=give;
 if(!S.tries){await talk([['cust','거스름돈 주세요!'],['guide','금고에서 돈을 눌러 접시에 담고, 주기를 눌러요.']]);pointAt($('area').firstElementChild,4000)}}
async function addMoney(v,el){if(S.busy||S.phase!=='change')return;sfx.coin();const from=stageXY(el);const html=moneyEl(v);S.plate.push(v);
 fly(`<div class="sm">${html}</div>`,from,(()=>{const p=stageXY($('plate'));return[p[0]+30,p[1]+8]})()).then(()=>{$('plate').innerHTML=plateHTML();bindPlate()});$('give').disabled=false;pointAt($('give'),6000)}
function bindPlate(){$('plate').querySelectorAll('.pg').forEach(m=>m.onclick=()=>{if(S.busy)return;S.plate.splice(S.plate.indexOf(+m.dataset.v),1);sfx.pop();$('plate').innerHTML=plateHTML();bindPlate();$('give').disabled=!S.plate.length})}
async function give(){if(S.busy||S.phase!=='change'||!S.plate.length)return;S.busy=true;hideHand();const g=sum(S.plate),c=S.paidSum-S.total;
 const sendPlate=async()=>{const html=$('plate').innerHTML;$('plate').innerHTML='';const p0=stageXY($('plate')),cu=stageXY($('cust'));await fly(`<div class="sm" style="display:flex">${html}</div>`,[p0[0]+20,p0[1]+4],[cu[0]+250,cu[1]+190]);sfx.coin()};
 if(g===c){await sendPlate();await done(0);return}
 S.tries++;sfx.no();custMood('sad');ownerMood('sad');
 if(S.tries===1){await talk([['cust','어? 거스름돈이 이상해요.']]);}
 else if(S.tries===2){anim($('eq'),'flash');await talk([['guide',`${won(S.total)}에서 시작해서, ${won(S.paidSum)}이 될 때까지 더해 보세요.`]]);}
 else{await sendPlate();
  if(g>c){const loss=g-c;S.lost+=loss;await talk([['cust',`와! ${won(loss)}이나 더 받았네요!`],['guide',`거스름돈을 ${won(loss)} 더 줘서, 가게 돈이 줄었어요. 거스름돈은 ${won(c)}이에요.`]]);await done(loss)}
  else{await talk([['cust',`어? ${won(c-g)} 모자라요.`],['guide',`거스름돈은 ${won(c)}이에요. 모자란 돈을 더 줬어요.`]]);await done(0)}
  return}
 custMood('normal');ownerMood('normal');S.busy=false}
async function done(loss){S.phase='done';S.order.forEach(x=>{S.stock[x.name]=(S.stock[x.name]||0)-x.qty;S.cogs+=unitCost(x.name)*x.qty});drawBoard();const earn=S.total-loss;S.money+=earn;S.sales+=S.total;
 $('eq').style.display='none';$('plate').style.display='none';$('area').innerHTML='';$('give').style.display='none';
 custMood('happy');ownerMood('happy');sfx.ching();(()=>{const o=center($('owner'));sparkle(o[0],o[1]-40,22)})();showDelta(earn);updHud();
 bubble(`<svg width="100" height="90" viewBox="0 0 24 22"><path d="M12 21s-9-5.5-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.5-9 12-9 12z" fill="#FF7AA2"/></svg>`);
 await talk([['cust','고마워요! 또 올게요!'],['guide',earn<0?`이번 손님에게는 ${won(-earn)} 손해를 봤어요. 다음엔 천천히 세어 봐요.`:loss?`${won(earn)} 벌었어요.`:`잘했어요! ${won(earn)} 벌었어요.`]]);
 hideBubble();const c=$('cust');c.classList.remove('walkin');anim(c,'walkout');$('custBody')&&$('custBody').classList.add('bob');await wait(1000);c.innerHTML='';
 S.busy=false;S.n<S.perDay?nextCustomer():settle()}
async function settle(){S.phase='settle';updHud();const net=S.sales-S.lost-S.cogs;const left=totalStock();const c=$('cover');c.classList.remove('hide');
 c.innerHTML=`<div class="logo">영업 끝!</div><div class="sumrow"><div class="k">${Object.keys(CUST).map(k=>`<div class="mini">${custHTML(k).replace('id="custBody"','').replace('class="breathe"','')}</div>`).join('')}<span>×${S.perDay}</span></div></div><div class="sumrow"><div class="k" style="font-size:84px;${net<0?'color:#D4483B':''}"><span class="ci" style="width:70px;height:70px;border-radius:50%;background:#F6C945;border:6px solid #D9A92A;display:inline-block"></span>${net<0?'−':'+'}${fmt(Math.abs(net))}</div></div><div style="font-size:30px;color:#9A7A66">판 돈 ${fmt(S.sales)} · 팔린 재료값 <span class="loss">−${fmt(S.cogs)}</span>${S.lost?` · 거스름돈 실수 <span class="loss">−${fmt(S.lost)}</span>`:''}${S.missed?` · 못 판 손님 ${S.missed}명`:''}${left?` · 남은 재료 ${left}개`:''}</div><div style="display:flex;gap:30px;align-items:center"><button class="ibtn" id="lvBtn" style="width:90px;height:90px" aria-label="단계 바꾸기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button><button class="play" id="dayBtn" aria-label="다음 날"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="#fff"/></svg></button></div>`;
 $('dayBtn').onclick=()=>{startDay()};$('lvBtn').onclick=startScreen;
 await talk([['guide',`오늘 영업 끝! ${won(S.sales)}을 팔았어요. 팔린 재료값 ${won(S.cogs)}을 빼면,${S.lost?` 거스름돈 실수로 ${won(S.lost)}이 나갔어요.`:''}${S.missed?` 재료가 없어서 손님 ${S.missed}명에게 못 팔았어요.`:''} ${net>=0?`오늘 번 돈은 ${won(net)}이에요.`:`오늘은 ${won(-net)} 손해를 봤어요.`}${left?` 남은 재료는 내일 또 팔 수 있어요.`:''}`]]);pointAt($('dayBtn'),3000)}
$('rpBtn').onclick=()=>{unlock();talk(LAST)};
$('sndBtn').onclick=()=>{S.sound=!S.sound;$('sndBtn').style.opacity=S.sound?1:.4;if(!S.sound&&window.speechSynthesis)speechSynthesis.cancel()};
$('owner').innerHTML=ownerHTML();
loadAssets().then(()=>{$('owner').innerHTML=ownerHTML();drawBoard()});
startScreen();
</script>
</body>
</html>
