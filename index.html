.bob{animation:bob .32s ease-in-out infinite alternate}

.breathe{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,0.985)}}
.jump{animation:jump .45s ease-out 2}
@keyframes jump{40%{transform:translateY(-60px) scale(1.04)}100%{transform:translateY(0)}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}

#owner{left:710px;top:200px;width:260px;height:300px}

.money{display:inline-flex;align-items:center;justify-content:center;border:4px solid;flex:none;cursor:pointer;transition:transform .1s}

.coin{border-radius:50%;font-size:26px}

.fly{position:absolute;z-index:50;transition:transform .8s cubic-bezier(.5,0,.3,1),opacity .8s;pointer-events:none}
.spark{position:absolute;width:22px;height:22px;border-radius:50%;background:#FFD166;z-index:60;pointer-events:none;transition:transform .9s ease-out,opacity .9s}
/* 손가락 */
#hand{width:110px;height:110px;z-index:80;pointer-events:none;display:none;animation:tap 1s infinite}
@keyframes tap{50%{transform:translate(-10px,-16px)}}
/* 덮개 화면 */
.cover{position:absolute;inset:0;background:#FFEFD6;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.cover.hide{display:none}
.lv{display:flex;gap:24px}
.lv button{width:210px;height:210px;border-radius:40px;border:6px solid #EAD5BC;background:#fff;font:inherit;font-size:60px;color:#5B3A2A;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.lv button small{font-size:28px;color:#B08A6E}
.lv button.on{border-color:#F28C5B;background:#FFF1E6}
.play{width:200px;height:200px;border-radius:50%;border:0;background:#F28C5B;box-shadow:0 10px 0 #C9683C;cursor:pointer;display:flex;align-items:center;justify-content:center}
.play svg{width:96px;height:96px}
.logo{font-size:84px;color:#E0703A}
.sumrow{display:flex;gap:40px;align-items:center;font-size:64px}
.sumrow .k{display:flex;align-items:center;gap:14px}
.loss{color:#D4483B}
#rotate{position:fixed;inset:0;background:#FFEFD6;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;font-size:30px}
#rotate svg{width:150px;height:150px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
body.port #stage{width:720px;height:1280px}
body.port #floor{top:760px;height:520px}body.port #floorLine{top:760px}
body.port #window{left:250px;top:100px;width:200px;height:140px}

body.port .choice{min-width:200px;font-size:46px;padding:16px 20px}
body.port #give{left:480px;top:1110px;width:210px;height:140px}
body.port #delta{left:100px;top:70px}
#tools{left:840px}body.port #tools{left:584px}
#ctrl{display:none;left:0;top:860px;width:720px;height:420px;background:#F28C5B}
</style>

<script>
const LV={
 1:{age:'6~7',menu:[['사탕',100],['쿠키',200],['우유',300],['주스',400]],safe:[100,500],maxQty:1,maxItems:2,maxTotal:900},
 2:{age:'8',menu:[['아메리카노',1500],['우유',1000],['쿠키',500],['라떼',2000]],safe:[100,500,1000],maxQty:1,maxItems:2,maxTotal:4500},
 3:{age:'9~10',menu:[['아메리카노',1500],['라떼',2000],['머핀',1200],['케이크',2500]],safe:[100,500,1000,5000],maxQty:3,maxItems:2,maxTotal:9800}
};
const S={level:2,money:10000,n:0,perDay:5,sales:0,lost:0,sound:true,order:null,total:0,paid:[],paidSum:0,tries:0,plate:[],busy:false,choiceSet:null,phase:''};
const $=id=>document.getElementById(id);
const fmt=v=>v.toLocaleString('ko-KR');
const won=v=>fmt(v)+'원';
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const sum=a=>a.reduce((x,y)=>x+y,0);
const unit=n=>/쿠키|머핀|케이크|사탕/.test(n)?'개':'잔';
const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* 화면 맞추기 */
function fit(){const port=innerHeight>innerWidth;document.body.classList.toggle('port',port);const W=port?720:1280,H=port?1280:720;const sc=Math.min(innerWidth/W,innerHeight/H);const st0=$('stage');st0.style.left='50%';st0.style.top='50%';st0.style.transformOrigin='center';st0.style.transform=`translate(-50%,-50%) scale(${sc})`;return;const s=Math.min(innerWidth/1280,innerHeight/720);const st=$('stage');st.style.transform=`scale(${s}) translate(-50%,-50%)`;st.style.transformOrigin='0 0';st.style.left='50%';st.style.top='50%';st.style.transform=`translate(-50%,-50%) scale(${s})`;st.style.transformOrigin='center'}
addEventListener('resize',fit);fit();
/* 소리 */
let AC=null;
function tone(fs,type,len){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type=type;g.gain.setValueAtTime(.16,t+i*len);g.gain.exponentialRampToValueAtTime(.001,t+i*len+.28);o.connect(g);g.connect(AC.destination);o.start(t+i*len);o.stop(t+i*len+.3)})}catch(e){}}
const sfx={ok:()=>tone([880,1320],'triangle',.11),no:()=>tone([300,220],'sine',.14),coin:()=>tone([1500],'triangle',.1),ching:()=>tone([1046,1318,1568,2093],'triangle',.08),pop:()=>tone([660],'sine',.1)};
let VOICE=null,VOICE2=null,LAST=[];
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));const nat=vs.filter(v=>/Natural|Online|Neural|Premium|Enhanced/i.test(v.name));VOICE=nat.find(v=>/SunHi|Yuna/i.test(v.name))||nat[0]||vs.find(v=>/Google|Yuna|Sora/i.test(v.name))||vs[0]||null;VOICE2=nat.find(v=>v!==VOICE)||VOICE}catch(e){}}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function talk(parts){LAST=parts;return new Promise(res=>{if(!S.sound||!window.speechSynthesis||!parts.length){setTimeout(res,parts.length?900*parts.length:0);return}
 try{const busy=speechSynthesis.speaking||speechSynthesis.pending;if(busy)speechSynthesis.cancel();let i=0;const next=()=>{if(i>=parts.length){res();return}const [role,txt]=parts[i++];const u=new SpeechSynthesisUtterance(txt.replace(/,/g,''));u.lang='ko-KR';const vv=role==='cust'?VOICE2:VOICE;if(vv)u.voice=vv;u.rate=role==='cust'?1.02:.94;u.pitch=role==='cust'?(VOICE2&&VOICE2!==VOICE?1.15:1.45):1.0;let done=false;const go=()=>{if(!done){done=true;next()}};u.onend=go;u.onerror=go;setTimeout(go,txt.length*260+1800);speechSynthesis.speak(u)};busy?setTimeout(next,120):next()}catch(e){res()}})}
function unlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();if(window.speechSynthesis){pickVoice();const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='ko-KR';speechSynthesis.speak(u)}}catch(e){}}
/* 그림 */
function icon(n){const s=b=>`<svg viewBox="0 0 60 60">${b}</svg>`;
 if(n==='아메리카노')return s('<path d="M14 20h28l-3 30H17z" fill="#fff" stroke="#D8C3AE" stroke-width="2"/><ellipse cx="28" cy="20" rx="14" ry="4" fill="#6B4226"/><path d="M42 26q10 2 0 14" fill="none" stroke="#D8C3AE" stroke-width="4"/>');
 if(n==='라떼')return s('<path d="M14 20h28l-3 30H17z" fill="#fff" stroke="#D8C3AE" stroke-width="2"/><ellipse cx="28" cy="20" rx="14" ry="4" fill="#C89B6D"/><path d="M25 19q3-3 3 0q0-3 3 0l-3 3z" fill="#fff"/><path d="M42 26q10 2 0 14" fill="none" stroke="#D8C3AE" stroke-width="4"/>');
 if(n==='우유')return s('<path d="M17 12h26l-3 40H20z" fill="#DDEFFA"/><path d="M18 24h24l-2 28H20z" fill="#fff" stroke="#C9E3F5" stroke-width="2"/>');
 if(n==='주스')return s('<path d="M17 14h26l-3 38H20z" fill="#DDEFFA"/><path d="M18 22h24l-2 30H20z" fill="#FFA94D"/><rect x="33" y="4" width="4" height="22" rx="2" fill="#FF6B8A" transform="rotate(12 35 15)"/>');
 if(n==='쿠키')return s('<circle cx="30" cy="30" r="20" fill="#D9A066"/><circle cx="22" cy="24" r="3" fill="#6B4226"/><circle cx="35" cy="22" r="3" fill="#6B4226"/><circle cx="30" cy="34" r="3" fill="#6B4226"/><circle cx="39" cy="36" r="2.5" fill="#6B4226"/><circle cx="21" cy="37" r="2.5" fill="#6B4226"/>');
 if(n==='사탕')return s('<path d="M10 22l10 8-10 8z" fill="#FFB3C7"/><path d="M50 22l-10 8 10 8z" fill="#FFB3C7"/><circle cx="30" cy="30" r="12" fill="#FF7AA2"/><path d="M24 26q6 8 12 0" fill="none" stroke="#fff" stroke-width="3"/>');
 if(n==='머핀')return s('<path d="M14 30h32l-5 22H19z" fill="#E58A5C"/><path d="M12 32q0-20 18-20t18 20z" fill="#8B5A3C"/><circle cx="24" cy="22" r="2" fill="#FFE07A"/><circle cx="34" cy="20" r="2" fill="#FFE07A"/>');
 if(n==='케이크')return s('<path d="M8 46l44 0-10-26z" fill="#FFE3B3"/><path d="M42 20l10 26h-6l-9-22z" fill="#F7B6C2"/><circle cx="43" cy="16" r="5" fill="#E8414E"/><rect x="8" y="46" width="44" height="6" rx="2" fill="#F7B6C2"/>');
 return ''}
function moneyEl(v,extra=''){return v>=1000?`<div class="money bill b${v} ${extra}" data-v="${v}">${fmt(v)}</div>`:`<div class="money coin c${v} ${extra}" data-v="${v}">${v}</div>`}
const CUST={
 bear:{name:'곰돌이',c:'#B07A4F',l:'#D9A97C',m:'#E9C9A2'},
 rabbit:{name:'토끼',c:'#F3ECE4',l:'#F7C6CC',m:'#FFFFFF'},
 squirrel:{name:'다람쥐',c:'#D9823B',l:'#F2C08E',m:'#F7D9B5'}
};
function custSVG(k){const p=CUST[k];let ears='';
 if(k==='bear')ears=`<circle cx="128" cy="96" r="30" fill="${p.c}"/><circle cx="252" cy="96" r="30" fill="${p.c}"/><circle cx="128" cy="96" r="15" fill="${p.l}"/><circle cx="252" cy="96" r="15" fill="${p.l}"/>`;
 if(k==='rabbit')ears=`<ellipse cx="155" cy="56" rx="22" ry="68" fill="${p.c}"/><ellipse cx="225" cy="56" rx="22" ry="68" fill="${p.c}"/><ellipse cx="155" cy="62" rx="10" ry="50" fill="${p.l}"/><ellipse cx="225" cy="62" rx="10" ry="50" fill="${p.l}"/>`;
 if(k==='squirrel')ears=`<path d="M70 460q-90-130 14-250q74-60 104 44q-60 60-14 206z" fill="#C26B2C"/><path d="M128 120l8-54 36 38z" fill="${p.c}"/><path d="M252 120l-8-54-36 38z" fill="${p.c}"/>`;
 return `<svg id="custBody" class="breathe" width="380" height="470" viewBox="0 0 380 470">${ears}<ellipse cx="190" cy="420" rx="110" ry="98" fill="${p.c}"/><ellipse cx="190" cy="438" rx="66" ry="60" fill="${p.l}"/><circle cx="190" cy="176" r="86" fill="${p.c}"/><ellipse cx="190" cy="210" rx="40" ry="30" fill="${p.m}"/><ellipse cx="190" cy="196" rx="14" ry="10" fill="#3A2A22"/><g class="blink"><circle cx="156" cy="160" r="10" fill="#3A2A22"/><circle cx="224" cy="160" r="10" fill="#3A2A22"/></g><ellipse cx="138" cy="196" rx="13" ry="8" fill="#FFA9A0" opacity=".7"/><ellipse cx="242" cy="196" rx="13" ry="8" fill="#FFA9A0" opacity=".7"/><path id="cMouth" d="M180 222q10 10 20 0" fill="none" stroke="#3A2A22" stroke-width="4" stroke-linecap="round"/><path d="M262 360q50-30 70-80" fill="none" stroke="${p.c}" stroke-width="34" stroke-linecap="round"/></svg>`}
function anim(el,cls,ms){el.classList.remove(cls);void el.getBoundingClientRect();el.classList.add(cls);if(ms)setTimeout(()=>el.classList.remove(cls),ms)}
function custMood(m){const mo=document.getElementById('cMouth');if(mo)mo.setAttribute('d',m==='happy'?'M174 218q16 18 32 0':m==='sad'?'M178 228q12-10 24 0':'M180 222q10 10 20 0');const b=document.getElementById('custBody');if(!b)return;if(m==='happy')anim(b,'jump',950);if(m==='sad')anim(b,'shake',520)}
function ownerMood(m){$('oMouth').setAttribute('d',m==='sad'?'M115 172q15-10 30 0':'M112 162q18 22 36 0');if(m==='happy')anim($('ownerBody'),'jump',950)}
function bubble(html){const b=$('bubble');b.innerHTML=html;b.classList.remove('hide');sfx.pop()}
function hideBubble(){$('bubble').classList.add('hide')}
/* 손가락 */
let IDLE=null;
function hideHand(){$('hand').style.display='none';clearTimeout(IDLE)}
function pointAt(el,delay=4500){clearTimeout(IDLE);IDLE=setTimeout(()=>{if(!el||!el.isConnected)return;const st=$('stage').getBoundingClientRect(),r=el.getBoundingClientRect(),k=st.width/SW();const h=$('hand');h.style.left=((r.left-st.left+r.width/2)/k-24)+'px';h.style.top=((r.top-st.top+r.height/2)/k-8)+'px';h.style.display='block'},delay)}
document.addEventListener('pointerdown',hideHand,true);
/* 날아가는 돈 */
function SW(){return document.body.classList.contains('port')?720:1280}
function center(el){const [x,y]=stageXY(el),k=$('stage').getBoundingClientRect().width/SW(),r=el.getBoundingClientRect();return[x+r.width/k/2,y+r.height/k/2]}
function stageXY(el){const st=$('stage').getBoundingClientRect(),r=el.getBoundingClientRect(),k=st.width/SW();return[(r.left-st.left)/k,(r.top-st.top)/k]}
function fly(html,from,to){return new Promise(res=>{const d=document.createElement('div');d.className='fly';d.innerHTML=html;d.style.left=from[0]+'px';d.style.top=from[1]+'px';$('stage').appendChild(d);void d.getBoundingClientRect();requestAnimationFrame(()=>{d.style.transform=`translate(${to[0]-from[0]}px,${to[1]-from[1]}px) scale(.7)`});setTimeout(()=>{d.remove();res()},820)})}
function sparkle(x,y,n=14){for(let i=0;i<n;i++){const s=document.createElement('div');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';s.style.background=['#FFD166','#F28C5B','#7CC9A6','#6CA6D9'][i%4];$('stage').appendChild(s);const a=Math.random()*Math.PI*2,r=80+Math.random()*120;requestAnimationFrame(()=>{s.style.transform=`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.3)`;s.style.opacity='0'});setTimeout(()=>s.remove(),950)}}
function showDelta(v){const d=$('delta');d.textContent=(v>=0?'+':'−')+fmt(Math.abs(v));d.style.color=v>=0?'#2F9E6E':'#D4483B';d.style.transition='none';d.style.opacity='1';d.style.transform='translateY(0)';void d.offsetWidth;d.style.transition='all 1.4s';d.style.opacity='0';d.style.transform='translateY(-40px)'}
/* HUD */
function updHud(){$('money').textContent=fmt(S.money);$('dots').innerHTML=Array.from({length:S.perDay},(_,i)=>`<i class="${i<S.n-1?'done':i===S.n-1?'on':''}"></i>`).join('')}
function drawBoard(){$('board').innerHTML=LV[S.level].menu.map(m=>`<div class="row">${icon(m[0])}<span style="font-size:22px">${m[0]}</span><span class="p">${fmt(m[1])}</span></div>`).join('')}
function clearArea(){$('area').innerHTML='';$('paw').innerHTML='';$('paw').classList.remove('pulse');$('plate').style.display='none';$('eq').style.display='none';$('give').style.display='none'}
/* 시작 화면 */
function startScreen(){S.phase='start';clearArea();hideBubble();$('cust').innerHTML='';drawBoard();updHud();
 const c=$('cover');c.classList.remove('hide');
 c.innerHTML=`<div class="logo">꼬마사장</div><div class="lv">${[1,2,3].map(l=>`<button data-l="${l}" class="${l===S.level?'on':''}">${LV[l].age}<small>살</small></button>`).join('')}</div><button class="play" id="playBtn" aria-label="시작"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="#fff"/></svg></button>`;
 c.querySelectorAll('.lv button').forEach(b=>b.onclick=()=>{unlock();S.level=+b.dataset.l;c.querySelectorAll('.lv button').forEach(x=>x.classList.toggle('on',x===b));drawBoard();sfx.pop();talk([['guide',`${LV[S.level].age}살 단계예요.`]])});
 $('playBtn').onclick=()=>{unlock();c.classList.add('hide');startDay()};
 pointAt($('playBtn'),2500)}
async function startDay(){S.n=0;S.sales=0;S.lost=0;drawBoard();await talk([['guide','가게 문을 열었어요! 첫 손님이 와요.']]);nextCustomer()}
/* 손님 */
function genOrder(){const L=LV[S.level];let o,t;do{const items=[...L.menu].sort(()=>Math.random()-.5).slice(0,rnd(1,L.maxItems));o=items.map(m=>({name:m[0],price:m[1],qty:rnd(1,L.maxQty)}));t=o.reduce((s,x)=>s+x.price*x.qty,0)}while(t>L.maxTotal);return{o,t}}
function genPaid(t){const lv=S.level;if(lv===1)return t<500?[500]:[1000];if(lv===2){if(t<1000)return[1000];if(t<5000&&Math.random()<.35){const k=Math.ceil(t/1000);if(k*1000>t)return Array(k).fill(1000)}return[5000]}return t<5000&&Math.random()<.5?[5000]:[10000]}
function orderText(o){return o.map(x=>`${x.name} ${x.qty}${unit(x.name)}`).join(', ')+' 주세요!'}
async function nextCustomer(){S.n++;updHud();S.cust=Object.keys(CUST)[rnd(0,2)];const g=genOrder();S.order=g.o;S.total=g.t;S.tries=0;S.plate=[];S.choiceSet=null;clearArea();hideBubble();ownerMood('normal');
 const c=$('cust');c.className='abs';c.innerHTML=custSVG(S.cust);anim(c,'walkin');const b=$('custBody');b.classList.add('bob');tone([520,620],'sine',.18);
 await wait(1300);b.classList.remove('bob');
 bubble(S.order.map(x=>`<div class="item">${icon(x.name)}${x.qty>1?`<span class="q">×${x.qty}</span>`:''}</div>`).join(''));
 await talk([['cust',`안녕하세요! ${orderText(S.order)}`]]);
 askTotal()}
function choices(t){const step=S.level===1?100:(S.level===2?500:[100,500,1000][rnd(0,2)]);const set=new Set([t]);let guard=0;while(set.size<3&&guard++<50){const v=t+step*(Math.random()<.5?-1:1)*rnd(1,2);if(v>0)set.add(v)}return[...set].sort(()=>Math.random()-.5)}
function askTotal(){S.phase='total';S.choiceSet=S.choiceSet||choices(S.total);
 bubble(S.order.map(x=>`<div class="item">${icon(x.name)}${x.qty>1?`<span class="q">×${x.qty}</span>`:''}<div class="pr">${fmt(x.price)}</div></div>`).join(''));
 $('area').style.width='860px';$('area').innerHTML=S.choiceSet.map(v=>`<button class="choice" data-v="${v}">${fmt(v)}</button>`).join('');
 $('area').querySelectorAll('.choice').forEach(b=>b.onclick=()=>pickTotal(+b.dataset.v,b));
 if(!S.tries)talk([['guide','모두 얼마일까요?']])}
async function pickTotal(v,btn){if(S.busy||S.phase!=='total')return;S.busy=true;
 if(v===S.total){sfx.ok();btn.classList.add('glow');ownerMood('happy');custMood('happy');await wait(500);S.busy=false;toPay();return}
 S.tries++;sfx.no();custMood('sad');ownerMood('sad');
 if(S.tries===1){await talk([['cust','어? 그게 아닌 것 같아요.']]);}
 else if(S.tries===2){const eq=$('eq');const single=S.order.length===1&&S.order[0].qty===1;eq.style.display=single?'none':'block';eq.innerHTML=S.order.map(x=>x.qty>1?`${fmt(x.price)}×${x.qty}`:fmt(x.price)).join(' + ')+' = <b>?</b>';anim(eq,'flash');
  const one=S.order.length===1&&S.order[0].qty===1;await talk([['guide',one?`메뉴판에서 ${S.order[0].name} 값을 찾아봐요.`:'같이 더해 봐요. '+S.order.map(x=>x.qty>1?`${won(x.price)} ${x.qty}번`:won(x.price)).join(' 더하기 ')+'.']]);}
 else{const right=[...$('area').children].find(b=>+b.dataset.v===S.total);right&&right.classList.add('glow');await talk([['guide',`정답은 ${won(S.total)}이에요.`]]);await wait(600);S.busy=false;toPay();return}
 custMood('normal');S.busy=false}
async function toPay(){S.phase='pay';S.tries=0;$('eq').style.display='none';$('area').innerHTML='';
 S.paid=genPaid(S.total);S.paidSum=sum(S.paid);
 bubble(`<div class="big">${fmt(S.paidSum)}</div>`);
 $('paw').innerHTML=S.paid.map(v=>moneyEl(v)).join('');$('paw').classList.add('pulse');
 await talk([['cust',`${won(S.total)}이요? 여기 ${won(S.paidSum)} 낼게요.`],['guide','손님 돈을 눌러서 받아요.']]);
 if(S.phase!=='pay')return;
 $('paw').querySelectorAll('.money').forEach(m=>m.onclick=receive);
 pointAt($('paw'),3500)}
async function receive(){if(S.busy||S.phase!=='pay')return;S.busy=true;hideHand();const p=$('paw');p.classList.remove('pulse');const from=stageXY(p);const html=p.innerHTML;p.innerHTML='';sfx.coin();
 const rc=center($('reg'));await fly(`<div class="sm" style="display:flex">${html}</div>`,from,[rc[0]-50,rc[1]-30]);sfx.ching();sparkle(rc[0],rc[1],10);
 S.busy=false;askChange()}
function plateHTML(){const g={};S.plate.forEach(v=>g[v]=(g[v]||0)+1);return Object.keys(g).map(Number).sort((a,b)=>b-a).map(v=>`<span class="pg" data-v="${v}">${moneyEl(v)}${g[v]>1?`<b>×${g[v]}</b>`:''}</span>`).join('')}
async function askChange(){S.phase='change';const L=LV[S.level];
 bubble(`<svg width="90" height="90" viewBox="0 0 60 60"><circle cx="24" cy="34" r="16" fill="#E3E6EA" stroke="#A9AEB5" stroke-width="3"/><circle cx="36" cy="26" r="16" fill="#EDEFF2" stroke="#8F96A0" stroke-width="3"/></svg><div class="big">?</div>`);
 const eq=$('eq');eq.style.display='block';eq.innerHTML=`${fmt(S.paidSum)} − ${fmt(S.total)} = <b>?</b>`;
 $('plate').style.display='flex';$('plate').innerHTML=plateHTML();
 $('area').style.width='640px';$('area').innerHTML=L.safe.map(d=>moneyEl(d)).join('');
 $('give').style.display='flex';$('give').disabled=!S.plate.length;
 $('area').querySelectorAll('.money').forEach(m=>m.onclick=()=>addMoney(+m.dataset.v,m));
 $('give').onclick=give;
 if(!S.tries){await talk([['cust','거스름돈 주세요!'],['guide','금고에서 돈을 눌러 접시에 담고, 주기를 눌러요.']]);pointAt($('area').firstElementChild,4000)}}
async function addMoney(v,el){if(S.busy||S.phase!=='change')return;sfx.coin();const from=stageXY(el);const html=moneyEl(v);S.plate.push(v);
 fly(`<div class="sm">${html}</div>`,from,(()=>{const p=stageXY($('plate'));return[p[0]+30,p[1]+8]})()).then(()=>{$('plate').innerHTML=plateHTML();bindPlate()});$('give').disabled=false;pointAt($('give'),6000)}
function bindPlate(){$('plate').querySelectorAll('.pg').forEach(m=>m.onclick=()=>{if(S.busy)return;S.plate.splice(S.plate.indexOf(+m.dataset.v),1);sfx.pop();$('plate').innerHTML=plateHTML();bindPlate();$('give').disabled=!S.plate.length})}
async function give(){if(S.busy||S.phase!=='change'||!S.plate.length)return;S.busy=true;hideHand();const g=sum(S.plate),c=S.paidSum-S.total;
 const sendPlate=async()=>{const html=$('plate').innerHTML;$('plate').innerHTML='';const p0=stageXY($('plate')),cu=stageXY($('cust'));await fly(`<div class="sm" style="display:flex">${html}</div>`,[p0[0]+20,p0[1]+4],[cu[0]+250,cu[1]+190]);sfx.coin()};
 if(g===c){await sendPlate();await done(0);return}
 S.tries++;sfx.no();custMood('sad');ownerMood('sad');
 if(S.tries===1){await talk([['cust','어? 거스름돈이 이상해요.']]);}
 else if(S.tries===2){anim($('eq'),'flash');await talk([['guide',`${won(S.total)}에서 시작해서, ${won(S.paidSum)}이 될 때까지 더해 보세요.`]]);}
 else{await sendPlate();
  if(g>c){const loss=g-c;S.lost+=loss;await talk([['cust',`와! ${won(loss)}이나 더 받았네요!`],['guide',`거스름돈을 ${won(loss)} 더 줘서, 가게 돈이 줄었어요. 거스름돈은 ${won(c)}이에요.`]]);await done(loss)}
  else{await talk([['cust',`어? ${won(c-g)} 모자라요.`],['guide',`거스름돈은 ${won(c)}이에요. 모자란 돈을 더 줬어요.`]]);await done(0)}
  return}
 custMood('normal');ownerMood('normal');S.busy=false}
async function done(loss){S.phase='done';const earn=S.total-loss;S.money+=earn;S.sales+=S.total;
 $('eq').style.display='none';$('plate').style.display='none';$('area').innerHTML='';$('give').style.display='none';
 custMood('happy');ownerMood('happy');sfx.ching();(()=>{const o=center($('owner'));sparkle(o[0],o[1]-40,22)})();showDelta(earn);updHud();
 bubble(`<svg width="100" height="90" viewBox="0 0 24 22"><path d="M12 21s-9-5.5-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.5-9 12-9 12z" fill="#FF7AA2"/></svg>`);
 await talk([['cust','고마워요! 또 올게요!'],['guide',earn<0?`이번 손님에게는 ${won(-earn)} 손해를 봤어요. 다음엔 천천히 세어 봐요.`:loss?`${won(earn)} 벌었어요.`:`잘했어요! ${won(earn)} 벌었어요.`]]);
 hideBubble();const c=$('cust');c.classList.remove('walkin');anim(c,'walkout');$('custBody')&&$('custBody').classList.add('bob');await wait(1000);c.innerHTML='';
 S.busy=false;S.n<S.perDay?nextCustomer():settle()}
async function settle(){S.phase='settle';updHud();const net=S.sales-S.lost;const c=$('cover');c.classList.remove('hide');
 c.innerHTML=`<div class="logo">영업 끝!</div><div class="sumrow"><div class="k">${Object.keys(CUST).map(k=>`<svg width="90" height="90" viewBox="40 -20 300 300">${custSVG(k).replace(/<svg[^>]*>|<\/svg>/g,'')}</svg>`).join('')}<span>×${S.perDay}</span></div></div><div class="sumrow"><div class="k" style="font-size:84px;${net<0?'color:#D4483B':''}"><span class="ci" style="width:70px;height:70px;border-radius:50%;background:#F6C945;border:6px solid #D9A92A;display:inline-block"></span>${net<0?'−':'+'}${fmt(Math.abs(net))}</div></div>${S.lost?`<div style="font-size:30px;color:#9A7A66">판 돈 ${fmt(S.sales)} · 거스름돈 실수 <span class="loss">−${fmt(S.lost)}</span></div>`:''}<div style="display:flex;gap:30px;align-items:center"><button class="ibtn" id="lvBtn" style="width:90px;height:90px" aria-label="단계 바꾸기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button><button class="play" id="dayBtn" aria-label="다음 날"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="#fff"/></svg></button></div>`;
 $('dayBtn').onclick=()=>{c.classList.add('hide');startDay()};$('lvBtn').onclick=startScreen;
 await talk([['guide',`오늘 영업 끝! 손님 ${S.perDay}명에게 ${won(S.sales)}을 팔았어요.${S.lost?` 거스름돈 실수로 ${won(S.lost)}이 나갔어요.`:''} 오늘 번 돈은 ${won(net)}이에요.`]]);pointAt($('dayBtn'),3000)}
$('rpBtn').onclick=()=>{unlock();talk(LAST)};
$('sndBtn').onclick=()=>{S.sound=!S.sound;$('sndBtn').style.opacity=S.sound?1:.4;if(!S.sound&&window.speechSynthesis)speechSynthesis.cancel()};
startScreen();
</script>
</body>
</html>
